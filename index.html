造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。","{xx.xu}":"虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。","{xx.wei}":"危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。","{xx.shi}":"室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。","{xx.qiang}":"壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。","{xx.kui}":"奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。","{xx.lou}":"娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。","{xx.vei}":"胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。","{xx.mao}":"昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。","{xx.bi}":"毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。","{xx.zi}":"觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。","{xx.can}":"参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。","{xx.jing}":"井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。","{xx.gui}":"鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。","{xx.liu}":"柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。","{xx.xing}":"星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。","{xx.zhang}":"张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。","{xx.yi}":"翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。","{xx.zhen}":"轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。"},ZHENG:{"{xx.jiao}":"{wx.mu}","{xx.jing}":"{wx.mu}","{xx.kui}":"{wx.mu}","{xx.dou}":"{wx.mu}","{xx.kang}":"{wx.jin}","{xx.gui}":"{wx.jin}","{xx.lou}":"{wx.jin}","{xx.niu}":"{wx.jin}","{xx.di}":"{wx.tu}","{xx.liu}":"{wx.tu}","{xx.vei}":"{wx.tu}","{xx.nv}":"{wx.tu}","{xx.fang}":"{wx.ri}","{xx.xing}":"{wx.ri}","{xx.mao}":"{wx.ri}","{xx.xu}":"{wx.ri}","{xx.xin}":"{wx.yue}","{xx.zhang}":"{wx.yue}","{xx.bi}":"{wx.yue}","{xx.wei}":"{wx.yue}","{xx.tail}":"{wx.huo}","{xx.yi}":"{wx.huo}","{xx.zi}":"{wx.huo}","{xx.shi}":"{wx.huo}","{x     <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;700&display=swap');

        :root {
            --china-red: #8e1818;      /* 故宫深红 */
            --paper-bg: #fdfbf7;       /* 极品宣纸 */
            --ink-main: #1a1a1a;       /* 浓墨 */
            --ink-light: #555;         /* 淡墨 */
            --gold-accent: #cfa972;    /* 沉金 */
            --wood: #2d6a4f; --fire: #c0392b; --earth: #8d6e63; --metal: #d4ac0d; --water: #1f618d;
        }

        /* 暗黑主题 */
        [data-theme="dark"] {
            --china-red: #ff6b6b;
            --paper-bg: #1a1a2e;
            --ink-main: #eee;
            --ink-light: #aaa;
            --gold-accent: #e8d5b7;
            --bg-pattern: none;
        }

        /* 故宫红主题 */
        [data-theme="red"] {
            --china-red: #c41e3a;
            --paper-bg: #fef0d9;
            --ink-main: #4a0404;
            --ink-light: #7a3b3b;
            --gold-accent: #daa520;
        }

        /* 主题切换按钮 */
        .theme-switcher {
            position: fixed;
            bottom: 80px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 90;
        }
        .theme-btn {
            position: relative; z-index: 1; 
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #ddd;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .theme-btn:hover { transform: scale(1.15); }
        .theme-btn.active { border-color: var(--china-red); }
        .theme-btn.classic { background: linear-gradient(135deg, #fdfbf7 50%, #8e1818 50%); }
        .theme-btn.dark { background: linear-gradient(135deg, #1a1a2e 50%, #ff6b6b 50%); }
        .theme-btn.red { background: linear-gradient(135deg, #fef0d9 50%, #c41e3a 50%); }

        /* 大运流年样式 */
        .dayun-section {
            margin-top: 30px;
        }
        .dayun-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--china-red);
            margin-bottom: 20px;
            font-family: 'Ma Shan Zheng', cursive;
        }
        .dayun-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }
        
        /* 3D翻转卡片 */
        .dayun-card {
            perspective: 1000px;
            height: 140px;
            cursor: pointer;
        }
        .dayun-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }
        .dayun-card.flipped .dayun-card-inner {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }
        .dayun-card-front, .dayun-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 8px;
            padding: 10px 8px;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
        }
        .dayun-card-front {
            background: linear-gradient(135deg, #fefefe 0%, #f8f5f0 100%);
            border: 1px solid #e0d5c5;
            z-index: 2;

<body><script>
// 🚀 移动端事件强制绑定（100%兼容方案）
document.addEventListener('DOMContentLoaded', function() {
    // 1. 开始按钮双重事件绑定
    const startBtn = document.querySelector('.btn-start');
    if (startBtn) {
        // 移动端触摸事件 - 无延迟响应
        let touchMoved = false;
        startBtn.addEventListener('touchstart', function() { touchMoved = false; }, { passive: true });
        startBtn.addEventListener('touchmove', function() { touchMoved = true; }, { passive: true });
        startBtn.addEventListener('touchend', function(e) {
            if (!touchMoved) { e.preventDefault(); if (window.startScan) window.startScan(); }
        }, { passive: false });
        // 桌面端点击事件
        startBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (window.startScan) window.startScan();
        });

    }
    
    // 2. 性别选择按钮
    document.querySelectorAll('.g-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            const gender = this.innerText.indexOf('男') > -1 ? 1 : 0;
            window.setGender(gender, this);
        });
    });
    
    // 3. 自动填充当前时间
    setTimeout(function() {
        const now = new Date();
        const str = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        const input = document.getElementById('birth-input');
        if (input) input.value = str;
        // 初始化真太阳时计算
        if (window.updateSolarTime) window.updateSolarTime();
    }, 200);
});
</script>

// 真太阳时校正函数
function updateSolarTime() {
    const birthInput = document.getElementById('birth-input');
    const citySelect = document.getElementById('city-select');
    const resultEl = document.getElementById('solar-time-result');
    const birthStr = birthInput.value;
    
    if (!birthStr) {
        if (resultEl) resultEl.innerHTML = '请先选择出生时间';
        return;
    }
    
    const lng = parseFloat(citySelect.value);
    const date = new Date(birthStr);
    
    // 1. 经度差校正：(经度 - 120) * 4分钟
    const lngDiff = (lng - 120) * 4;
    
    // 2. 均时差（简化版公式）
    const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
    const b = 2 * Math.PI * (dayOfYear - 81) / 365;
    const equationOfTime = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
    
    // 3. 夏令时校正：1986-1991年中国夏令时（4月中-9月中）
    let dst = 0;
    const year = date.getFullYear();
    if (year >= 1986 && year <= 1991) {
        const month = date.getMonth() + 1;
        if (month > 4 && month < 9) {
            dst = -60; // 夏令时减1小时
        }
    }
    
    const totalDiff = lngDiff + equationOfTime + dst;
    const solarDate = new Date(date.getTime() + totalDiff * 60000);
    
    // 格式化显示
    const format = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    
    const diffText = totalDiff > 0 ? `+${totalDiff.toFixed(1)}` : totalDiff.toFixed(1);
    resultEl.innerHTML = `
        校正前：${format(date)} (北京时间)<br>
        经度差：${(lng - 120).toFixed(1)}° → ${lngDiff > 0 ? '+' : ''}${lngDiff.toFixed(1)}分钟<br>
        均时差：${equationOfTime > 0 ? '+' : ''}${equationOfTime.toFixed(1)}分钟<br>
        ${dst !== 0 ? `夏令时：${dst > 0 ? '+' : ''}${dst}分钟<br>` : ''}
        ——————————————————————<br>
        <strong>校正后（真太阳时）：</strong><span class="solar-time-diff">${format(solarDate)}</span><br>
        <small>总时差：${diffText}分钟</small>
    `;
    
    // 保存真太阳时到全局，供排盘使用
    window.solarDateTime = solarDate;
}

        "假从财格": { desc: "假从财格，财旺身弱，但局中有一点微弱印比或微根。日主想从又不彻底。行运去其杂气（克掉印比）则发，行运助身（印比）则败。富贵多有起伏。", joy: ["🎨 食伤", "💰 财星"], taboo: ["💪 比劫", "📜 印星"] },
        "真从杀格": { desc: "真从杀格，满盘官杀，日主无根，舍命从杀。此格贵不可言，掌握生杀大权。喜财生杀。最忌食伤制杀（与杀对抗），忌印比帮身。", joy: ["💰 财星", "🗡️ 官杀"], taboo: ["🎨 食伤 (制杀)", "💪 比劫", "📜 印星"] },
        "假从杀格": { desc: "假从杀格，官杀虽旺，但有微根或微印。日主内心不服，局势不纯。行运去其杂气则贵，否则多生波折，官非不断。", joy: ["💰 财星", "🗡️ 官杀"], taboo: ["🎨 食伤", "📜 印星"] },
        "真从儿格": { desc: "满盘食伤，日主无根。又名'从儿格'。喜吾儿（食伤）再见儿（财）。最忌印星克制食伤。见官杀则与食伤交战，亦不吉。", joy: ["🎨 食伤", "💰 财星"], taboo: ["📜 印星", "🗡️ 官杀"] },
        "假从儿格": { desc: "食伤旺，但有微印干扰。才华虽有，常受长辈或环境压制。需行财运破印，方能施展抱负。", joy: ["💰 财星"], taboo: ["📜 印星"] },

        "金水伤官": { desc: "冬金极寒，必用火（官杀）调候。此格见火即激活显贵，无火则如寒潭之剑，才华虽高却孤冷难成。若有木火通关，则名利双收。最忌金水再旺，所谓'金水多清寒'。", joy: ["🔥 火 (调候)","🌲 木 (财星)"], taboo: ["💧 水 (伤官)","⛰️ 土 (埋金)"] },
        "金水食神": { desc: "金白水清，才华绝代。最忌水多沉金，喜火暖局。若无火气，则才华流于孤冷，难获世俗功名。气象清逸之极。", joy: ["🔥 火 (暖局)","🌲 木 (通关)"], taboo: ["⛰️ 土 (夺食)","💧 水 (沉沦)"] },
        "木火通明": { desc: "木生春月，见火泄秀。忌金克伐，忌水灭火。文彩风流，名扬天下。喜火木，忌金水。", joy: ["🔥 火 (泄秀)","🌲 木 (助势)"], taboo: ["🗡️ 金 (克木)","💧 水 (灭火)"] },
        "伤官配印": { desc: "局中伤官有力且见水印护身。犹如狂飙之马配以金络，文武兼备。印星不仅制伤，更起调候之功，使格局由浊变清。此格最喜身弱伤旺，用印生身制伤，主名满天下。", joy: ["💧 水 (印星)","🌲 木 (帮身)"], taboo: ["⛰️ 土 (坏印)","🔥 火 (燥热)"] },
        "伤官合杀": { desc: "伤杀两旺，合杀为权。以智慧谋略化解危机，典型的'险中求贵'之格。凶物互制，反而成贵。", joy: ["📜 印星","💪 比劫"], taboo: ["💰 财星","🗡️ 官杀"] },
        "食神制杀": { desc: "七杀有力，食神制之。身强杀浅，权柄极重。喜食印，忌财杀。", joy: ["🎨 食神","📜 印星"], taboo: ["💰 财星","🗡️ 官杀"] },
        "杀印相生": { desc: "杀势汹汹，赖印化之。化煞为权，主武职或掌握实权的管理者。喜印比，忌财。", joy: ["📜 印星","💪 比劫"], taboo: ["💰 财星","🗡️ 官杀"] },
        "正财格": { desc: "财星当令，求财有道。身强任财，身弱喜印比。步步为营之富。最忌比劫夺财或官杀泄财。", joy: ["💪 比劫","📜 印星"], taboo: ["💰 财 (身弱)","🗡️ 官杀"] },
        "偏财格": { desc: "偏财当令，慷慨大方。喜官杀护财，喜食伤生财。最忌比劫分夺。财大气粗之格。", joy: ["🗡️ 官杀","🎨 食伤"], taboo: ["💪 比劫","空亡"] },
        "正官格": { desc: "正官纯正，贵气天然。喜财生官，喜印护官。最忌伤官见官，所谓'伤官见官，为祸百端'。", joy: ["💰 财星","📜 印星"], taboo: ["🎨 伤官","🗡️ 七杀"] },
        "七杀格": { desc: "杀神威严，攻身最狠。需制化方成大格。无制则压力重重，灾厄丛生。有制则为'化煞为权'。", joy: ["🎨 食伤 (制)","📜 印星 (化)"], taboo: ["💰 财星 (助杀)"] },
        "正印格": { desc: "印绶生身，慈悲温厚。喜官杀生印，忌财坏印。印绶被坏，则名声受损，学业受阻。", joy: ["🗡️ 官杀","💪 比劫"], taboo: ["💰 财星"] },
        "偏印格": { desc: "偏印当权，鬼才逻辑。喜偏财制枭。无财制枭则为'枭神夺食'，主灾。", joy: ["💰 偏财","天月德"], taboo: ["🎨 食神"] },
        "食神格": { desc: "食神生财，福寿双全。忌枭神夺食。食神乃爵星，不仅主财，更主寿。", joy: ["💰 财星","💪 比劫"], taboo: ["📜 偏印"] },
        "伤官格": { desc: "伤官当令，才华横溢。需印制或财化。无制化则为'伤官无制'，狂傲惹祸。", joy: ["📜 印星","💰 财星"], taboo: ["🗡️ 官杀","💪 比劫"] },
        "伤官生财": { desc: "伤官有根，生财有情。技艺致富。伤官转为生财之源，主富不主贵。", joy: ["💰 财星","🎨 伤官"], taboo: ["📜 印星","💪 比劫"] },
        "食神生财": { desc: "食神有根，生财安稳。福气之局。食神生财，富贵自来，且财源长久。", joy: ["💰 财星","🎨 食神"], taboo: ["📜 偏印","🗡️ 官杀"] },
        "建禄格": { desc: "月令建禄，身强财弱。喜财官食伤泄秀。最忌比劫分财。白手起家之格。", joy: ["💰 财星","🗡️ 官杀"], taboo: ["💪 比劫","📜 印星"] },
        "月劫格": { desc: "月令劫财，争财夺利。需官杀制劫或食伤化劫。无制则破财刑妻。", joy: ["🗡️ 官杀","🎨 食伤"], taboo: ["💪 比劫","📜 印星"] },
        "阳刃格": { desc: "阳刃当权，刚强无比。喜七杀制刃，喜食伤泄秀。忌财旺生杀。'羊刃驾杀'为武贵。", joy: ["🗡️ 七杀","🎨 食伤"], taboo: ["💰 财星"] },
        "杂格": { desc: "格局未清，五行杂居。全凭扶抑调候，需看日主底蕴与通关。后天努力可扭乾坤。", joy: ["扶助用神"], taboo: ["克害用神"] }
    }
  </script>

  </script>

  <script>
console.log("✅ 业务脚本开始执行");

    // ==================== 新增: 工具函数与优化 ====================

    const HISTORY_KEY = 'fate_bazi_history_v1';
    const HISTORY_MAX = 20;
    const THEME_KEY = 'fate_bazi_theme_v1';

    /**
     * 设置主题
     * @param {string} theme - 主题名: classic/dark/red
     */
    window.setTheme = function(theme) {
        if (theme === 'classic') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', theme);
        }

        // 更新按钮状态
        document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.theme-btn.${theme}`).classList.add('active');

        // 保存到本地
        localStorage.setItem(THEME_KEY, theme);
        logDebug('THEME', 'Switched to: ' + theme);
    }

    /**
     * 初始化主题（从本地记忆恢复）
     */
    window.initTheme = function() {
        const savedTheme = localStorage.getItem(THEME_KEY) || 'classic';
        setTheme(savedTheme);
    }

    // 页面加载时自动恢复主题
    document.addEventListener('DOMContentLoaded', initTheme);

    /**
     * 生成分享卡片并下载（移动端优化版）
     */
    window.exportCard = async function() {
        const btn = document.querySelector('.export-btn');
        const originalText = btn.innerHTML;

        try {
            btn.disabled = true;
            btn.innerHTML = '⏳ 生成中...';

            // 获取结果区域
            const resultArea = document.getElementById('result-area');
            if (!resultArea || resultArea.style.display === 'none') {
                showError('请先进行八字鑑定');
                return;
            }

            // 先检查库是否加载，如果没加载则动态加载（双保险）
            if (typeof html2canvas === 'undefined') {
                showError('正在加载组件，请重试...');
                // 动态加载fallback
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
                await new Promise(r => setTimeout(r, 500));
            }

            // 简化配置，提升移动端兼容性
            const canvas = await html2canvas(resultArea, {
                scale: 1.5,          // 略微降低分辨率，提升移动端稳定性
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#fdfbf7',
                logging: false,
                ignoreElements: (el) => {
                    // 忽略按钮区域
                    return el.classList && el.classList.contains('action-bar');
                }
            });

            // 下载图片
            const link = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            link.download = `天命鑑定_${dateStr}.png`;
            link.href = canvas.toDataURL('image/png', 0.9); // 略微压缩，加快速度
            link.click();

            logDebug('EXPORT', '分享卡片已生成');
            showError('✅ 分享卡片已保存到相册！');

        } catch (error) {
            console.error('导出失败:', error);
            showError('生成失败，请截图保存即可');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    /**
     * 显示用户友好的错误提示
     * @param {string} message - 错误信息
     * @param {number} duration - 显示时长(ms)
     */
    window.showError = functionmessage, duration = 3000) {
        const toast = document.getElementById('error-toast');
        toast.textContent = '⚠️ ' + message;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', duration);
    }

    /**
     * 控制台日志封装（方便未来扩展日志上报）
     * @param {string} type - 日志类型
     * @param {*} data - 日志数据
     */
    window.logDebug = functiontype, data) {
        console.log(`[Fate ${type}]`, data);
    }

    /**
     * 安全的DOM元素获取
     * @param {string} id - 元素ID
     * @returns {HTMLElement|null}
     */
    window.safeGetElement = function(id) {
        const el = document.getElementById(id);
        if (!el) logDebug('WARNING', `Element #${id} not found`);
        return el;
    }

    // ==================== 新增: 加载步骤动画 ====================
    const LOADER_STEPS = ['step-1', 'step-2', 'step-3', 'step-4', 'step-5'];
    let currentStepIndex = 0;
    let stepTimer = null;

    /**
     * 显示加载步骤动画
     */
    window.showLoaderSteps = function() {
        const stepsPanel = safeGetElement('loader-steps');
        if (!stepsPanel) return;
        
        stepsPanel.style.display = 'block';
        LOADER_STEPS.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('active', 'done');
            }
        });
        currentStepIndex = 0;
        animateNextStep();
    }

    /**
     * 执行下一步动画
     */
    window.animateNextStep = function() {
        if (stepTimer) clearTimeout(stepTimer);
        
        if (currentStepIndex > 0 && currentStepIndex <= LOADER_STEPS.length) {
            const prevEl = document.getElementById(LOADER_STEPS[currentStepIndex - 1]);
            if (prevEl) prevEl.classList.add('done');
        }
        
        if (currentStepIndex < LOADER_STEPS.length) {
            const currEl = document.getElementById(LOADER_STEPS[currentStepIndex]);
            if (currEl) currEl.classList.add('active');
            currentStepIndex++;
            stepTimer = setTimeout(animateNextStep, 400);
        }
    }

    // ==================== 原有函数优化: JSDoc + try-catch ====================

    /**
     * 判断日主在地支是否有根
     * @param {string} gan - 天干
     * @param {Array} pillars - 四柱数组
     * @returns {boolean}
     */
    window.hasRoot = functiongan, pillars) {
        const roots = ROOT_MAP[gan] || [];
        return pillars.some(p => roots.includes(p.z));
    }

    /**
     * 计算月令司令真神
     * @param {Object} lunar - 农历对象
     * @param {string} mz - 月支
     * @returns {Object} commander司令, diffDays天数差
     */
    window.calcCommander = functionlunar, mz) {
        const pj = lunar.getPrevJie();
        const s = lunar.getSolar();
        const pjs = pj.getSolar();
        const d1 = new Date(s.getYear(), s.getMonth()-1, s.getDay(), s.getHour(), s.getMinute());
        const d2 = new Date(pjs.getYear(), pjs.getMonth()-1, pjs.getDay(), pjs.getHour(), pjs.getMinute());
        const diff = Math.floor((d1.getTime() - d2.getTime()) / (1000 * 60 * 60 * 24));
        const rules = SILING_RULES[mz];
        let commander = rules[rules.length-1][0]; 
        let sum = 0;
        for (let r of rules) { sum += r[1]; if (diff < sum) { commander = r[0]; break; } }
        return { commander, diffDays: diff };
    }

    // ==========================================
    // 4. 格局判定核心逻辑 (含真假从格 + 气势判定 + 优先级修复)
    // ==========================================
    window.determinePattern = functionclimate, pillars, dm, mz, cmd) {
        const stems = [pillars[0].g, pillars[1].g, pillars[3].g];
        const zhis = pillars.map(p => p.z);
        
        const dmRooted = hasRoot(dm, pillars);
        let mzMainGod = SHISHEN_MAP[dm][ZHI_MAIN_QI[mz]]; 

        // === 1. 气势判定 (Formation Override) ===
        if (!dmRooted) {
             const dmElement = WUXING_MAP[dm];
             if (dmElement === '金') {
                 if ((zhis.includes('亥') && zhis.includes('卯')) || 
                     (zhis.includes('寅') && zhis.includes('卯')) || 
                     (zhis.includes('亥') && zhis.includes('寅'))) {
                     if (mzMainGod === '食神' || mzMainGod === '伤官') mzMainGod = '偏财';
                 }
             }
             if (dmElement === '水') {
                 if ((zhis.includes('寅') && zhis.includes('午')) || 
                     (zhis.includes('巳') && zhis.includes('午'))) {
                     mzMainGod = '偏财';
                 }
             }
             if (dmElement === '火') {
                 if ((zhis.includes('巳') && zhis.includes('酉')) || 
                     (zhis.includes('申') && zhis.includes('酉'))) {
                     mzMainGod = '偏财';
                 }
             }
        }

        const supportStemsCount = stems.filter(s => {
            const god = SHISHEN_MAP[dm][s];
            return ["正印","偏印","比肩","劫财"].includes(god);
        }).length;

        // === 2. 优先判定“从格” (Cong Ge Priority) ===
        if (!dmRooted) {
            if (mzMainGod.includes("财")) {
                if (supportStemsCount === 0) return "真从财格";
                if (supportStemsCount <= 2) return "假从财格"; 
            }
            if (mzMainGod === "七杀" || mzMainGod === "正官") {
                if (supportStemsCount === 0) return "真从杀格";
                if (supportStemsCount <= 2) return "假从杀格";
            }
            if (mzMainGod === "食神" || mzMainGod === "伤官") {
                const hasSeal = stems.some(s => ["正印","偏印"].includes(SHISHEN_MAP[dm][s]));
                if (!hasSeal && supportStemsCount === 0) return "真从儿格";
                if (hasSeal || supportStemsCount > 0) return "假从儿格";
            }
        }

        // === 3. 关键交互 (Interaction Priority - 针对 乙亥/庚辰/己丑/壬申 此类天干成格) ===
        // 必须优先于月令本气判定
        const hasKill = stems.some(s => SHISHEN_MAP[dm][s] === "七杀");
        const hasHurt = stems.some(s => SHISHEN_MAP[dm][s] === "伤官");
        const hasSeal = stems.some(s => ["正印","偏印"].includes(SHISHEN_MAP[dm][s]));
        const hasFood = stems.some(s => SHISHEN_MAP[dm][s] === "食神");

        // 伤官合杀：见七杀且见伤官
        if (hasKill && hasHurt) return "伤官合杀";
        // 食神制杀：见七杀且见食神
        if (hasKill && hasFood) return "食神制杀";
        // 杀印相生：见七杀且见印
        if (hasKill && hasSeal) return "杀印相生";
        // 伤官配印：伤官旺且见印
        if (hasHurt && hasSeal && hasRoot(dm, pillars)) return "伤官配印";

        // === 4. 特殊气候格 (Climate Special) ===
        if (climate.special) return climate.special;

        // === 5. 阳刃/建禄/月劫 (Standard Strong Patterns) ===
        if (YANG_REN_MAP[dm] === mz) return "阳刃格";
        if (WUXING_MAP[dm] === WUXING_MAP[mz] && mz !== YANG_REN_MAP[dm]) return "建禄格";
        if (mzMainGod === "劫财") return "月劫格";

        // === 6. 普通正格 (Standard Month Commander) ===
        if (stems.includes(cmd.commander)) {
            const god = SHISHEN_MAP[dm][cmd.commander];
            const map = {
                "正财":"正财格", "偏财":"偏财格", 
                "正官":"正官格", "七杀":"七杀格",
                "正印":"正印格", "偏印":"偏印格",
                "食神":"食神格", "伤官":"伤官格"
            };
            if (map[god]) return map[god];
        }

        // === 7. 本气兜底 ===
        const fallback = {
            "正财":"正财格", "偏财":"偏财格", 
            "正官":"正官格", "七杀":"七杀格",
            "正印":"正印格", "偏印":"偏印格",
            "食神":"食神格", "伤官":"伤官格",
            "比肩":"建禄格", "劫财":"月劫格"
        };
        return fallback[mzMainGod] || "杂格";
    }

    window.getDMDesc = functiondm, mz) {
        const season = ["亥","子","丑"].includes(mz) ? "冬" : ["巳","午","未"].includes(mz) ? "夏" : ["寅","卯","辰"].includes(mz) ? "春" : "秋";
        return `你是生于${season}季的【${dm}】。`;
    }

    /**
     * 检查并等待核心历法库加载完成
     * @param {number} maxRetries - 最大重试次数
     * @returns {Promise<boolean>}
     */
    window.waitForLunarLibrary = async functionmaxRetries = 5) {
        for (let i = 0; i < maxRetries; i++) {
            if (typeof Lunar !== 'undefined' && typeof Solar !== 'undefined') {
                return true;
            }
            logDebug('WAIT', `等待历法库加载... (${i + 1}/${maxRetries})`);
            await new Promise(resolve => setTimeout(resolve, 500));
        }
        return false;
    }

    /**
     * 开始八字鑑定主流程
     * 包含错误处理、加载动画、完整计算流程
     */
    window.startScan = async function() {
        // 前置校验
        const timeStr = document.getElementById('birth-input').value;
        if (!timeStr) {
            showError('请选择出生时间！');
            return;
        }

        // 等待核心库加载（带重试机制）
        const libraryLoaded = await waitForLunarLibrary();
        if (!libraryLoaded) {
            showError('历法库加载中，请稍等几秒再试...');
            return;
        }

        const loader = document.getElementById('loader');
        if (loader) loader.style.display = 'inline-block';

        // 显示加载步骤动画
        showLoaderSteps();

        setTimeout(async () => {
            try {
                logDebug('INFO', 'Starting Bazi calculation: ' + timeStr);

                // 使用真太阳时进行排盘，如果有真太阳时的话
                let date = window.solarDateTime ? new Date(window.solarDateTime) : new Date(timeStr);
                if (isNaN(date.getTime())) {
                    // 回退到原始时间
                    date = new Date(timeStr);
                    if (isNaN(date.getTime())) {
                        throw new Error('日期格式无效');
                    }
                }

                const solar = Solar.fromYmdHms(
                    date.getFullYear(),
                    date.getMonth() + 1,
                    date.getDate(),
                    date.getHours(),
                    date.getMinutes(),
                    date.getSeconds()
                );

                const lunar = solar.getLunar();
                const baziObj = lunar.getEightChar();
                baziObj.setSect(2);

                const pillars = [
                    { t: '年', g: baziObj.getYearGan().toString(), z: baziObj.getYearZhi().toString() },
                    { t: '月', g: baziObj.getMonthGan().toString(), z: baziObj.getMonthZhi().toString() },
                    { t: '日', g: baziObj.getDayGan().toString(), z: baziObj.getDayZhi().toString() },
                    { t: '时', g: baziObj.getTimeGan().toString(), z: baziObj.getTimeZhi().toString() },
                ];

                const dm = pillars[2].g; // 日主天干
                const mz = pillars[1].z; // 月支
                const cmd = calcCommander(lunar, mz);

                // 调候激活判断
                const isWinter = ['亥', '子', '丑'].includes(mz);
                const isSummer = ['巳', '午', '未'].includes(mz);
                const hasFire = pillars.some(p => WUXING_MAP[p.g] === '火' || WUXING_MAP[p.z] === '火');
                const hasWater = pillars.some(p => WUXING_MAP[p.g] === '水' || WUXING_MAP[p.z] === '水');

                let activated = false;
                let activationStatus = '', activationDesc = '';

                if ((WUXING_MAP[dm] === '金' && isWinter && hasFire) ||
                    (WUXING_MAP[dm] === '木' && isSummer && hasWater) ||
                    (WUXING_MAP[dm] === '土' && isWinter && hasFire)) {
                    activated = true;
                    activationStatus = '🔥 紫气东来 · 格局变贵';
                    activationDesc = '局中见调候真神，犹如寒金遇火、焦木逢雨。原格力量瞬间激活，层次倍增，名利双收之象。';
                }

                const climate = { special: null };
                if (WUXING_MAP[dm] === '金' && isWinter) {
                    climate.special = pillars.some(p => SHISHEN_MAP[dm][p.g] === '伤官') ? '金水伤官' : '金水食神';
                }
                if (WUXING_MAP[dm] === '木' && ['寅', '卯'].includes(mz) && hasFire) climate.special = '木火通明';
                if (WUXING_MAP[dm] === '木' && (isSummer || mz === '巳') && hasWater &&
                    pillars.some(p => SHISHEN_MAP[dm][p.g] === '伤官' && hasRoot(p.g, pillars))) {
                    climate.special = '伤官配印';
                }

                const pattern = determinePattern(climate, pillars, dm, mz, cmd);
                logDebug('SUCCESS', 'Pattern determined: ' + pattern);

                // 渲染结果
                const resultArea = document.getElementById('result-area');
                resultArea.style.display = 'block';

                const activationArea = document.getElementById('activation-area');
                if (activated) {
                    activationArea.style.display = 'block';
                    safeSetText('activation-status', activationStatus);
                    safeSetText('activation-desc', activationDesc);
                } else {
                    activationArea.style.display = 'none';
                }

                const patternData = GAME_DB[pattern] || GAME_DB['杂格'];
                renderUI(pattern, cmd, dm, mz, pillars, patternData);
                renderWuxingBar(pillars);

                // 滚动到结果区
                setTimeout(() => {
                    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);

                // 保存到历史记录
                saveToHistory({
                    pattern: pattern,
                    name: patternData.name,
                    icon: patternData.icon,
                    pillars: pillars
                });

            } catch (error) {
                logDebug('ERROR', error.message);
                showError('鑑定失败: ' + error.message);
                console.error('Bazi calculation error:', error);
            } finally {
                // 清理
                if (loader) loader.style.display = 'none';
                hideLoaderSteps();
            }
        }, 300);
    }

    // ==========================================
    // 大运流年核心计算
    // ==========================================

    // 60甲子顺序表
    const JIAZI_60 = [
        '甲子','乙丑','丙寅','丁卯','戊辰','己巳','庚午','辛未','壬申','癸酉','甲戌','乙亥',
        '丙子','丁丑','戊寅','己卯','庚辰','辛巳','壬午','癸未','甲申','乙酉','丙戌','丁亥',
        '戊子','己丑','庚寅','辛卯','壬辰','癸巳','甲午','乙未','丙申','丁酉','戊戌','己亥',
        '庚子','辛丑','壬寅','癸卯','甲辰','乙巳','丙午','丁未','戊申','己酉','庚戌','辛亥',
        '壬子','癸丑','甲寅','乙卯','丙辰','丁巳','戊午','己未','庚申','辛酉','壬戌','癸亥'
    ];

    /**
     * 计算并渲染大运（精准版）
     * @param {string} dm - 日主天干
     * @param {Array} pillars - 四柱
     * @param {Object} xiji - 喜忌数据
     */
    window.renderDayun = functiondm, pillars, xiji) {
        const dayunArea = document.getElementById('dayun-area');
        const dayunGrid = document.getElementById('dayun-grid');

        // 获取月柱干支
        const monthGan = pillars[1].g;
        const monthZhi = pillars[1].z;
        const monthIndex = JIAZI_60.indexOf(monthGan + monthZhi);

        // ========== 精准起运计算 ==========
        // 男阳年顺排、阴年逆排；女反之
        const isYang = ['甲','丙','戊','庚','壬'].includes(pillars[0].g[0]);
        const shunPai = (currentGender === 1 && isYang) || (currentGender === 0 && !isYang);

        // 3天=1岁，1天=4个月，1时辰=10天
        // 使用lunar库的节气方法精确计算
        const jieQiList = lunar.getJieQiList();
        const birthSolar = lunar.getSolar();
        const birthYear = birthSolar.getYear();
        const birthMonth = birthSolar.getMonth();
        const birthDay = birthSolar.getDay();
        
        // 找到最近的前后节气
        let prevJie = null, nextJie = null;
        const yearJieQi = Solar.fromYmd(birthYear, 1, 1).getLunar().getJieQiTable();
        const nextYearJieQi = Solar.fromYmd(birthYear + 1, 1, 1).getLunar().getJieQiTable();
        
        // 合并两年的节气表
        const allJieQi = {...yearJieQi, ...nextYearJieQi};
        
        // 找出节气（12节：立春、惊蛰、清明、立夏、芒种、小暑、立秋、白露、寒露、立冬、大雪、小寒）
        const jieNames = ['立春','惊蛰','清明','立夏','芒种','小暑','立秋','白露','寒露','立冬','大雪','小寒'];
        const jieList = jieNames.map(name => allJieQi[name]).filter(Boolean);
        
        // 找到出生日前后的节
        let minDiffPrev = Infinity, minDiffNext = Infinity;
        for (let jie of jieList) {
            const jieYear = jie.getYear();
            const jieMonth = jie.getMonth();
            const jieDay = jie.getDay();
            // 简化计算天数差
            const daysFromJie = (birthYear - jieYear) * 365 + (birthMonth - jieMonth) * 30 + (birthDay - jieDay);
            if (daysFromJie >= 0 && daysFromJie < minDiffPrev) {
                minDiffPrev = daysFromJie;
                prevJie = jie;
            }
            if (daysFromJie <= 0 && -daysFromJie < minDiffNext) {
                minDiffNext = -daysFromJie;
                nextJie = jie;
            }
        }
        
        // 计算起运天数（3天=1岁，精确到天数）
        let daysToJie = shunPai ? (nextJie ? minDiffNext : 0) : (prevJie ? minDiffPrev : 0);
        if (daysToJie === 0) daysToJie = 3;  // 边界保护
        
        // 3天=1岁，计算起运年龄
        const startAge = Math.max(0, Math.floor(daysToJie / 3));

        const birthYear = parseInt(document.getElementById('birth-input').value.slice(0,4));

        // ========== 生成8步大运 ==========
        let dayunHtml = '';
        for (let i = 0; i < 8; i++) {
            let dayunIndex;
            if (shunPai) {
                dayunIndex = (monthIndex + i + 1) % 60;
            } else {
                dayunIndex = (monthIndex - i - 1 + 60) % 60;
            }

            const dayunGanzhi = JIAZI_60[dayunIndex];
            const dayunGan = dayunGanzhi[0];
            const dayunZhi = dayunGanzhi[1];
            const shishen = SHISHEN_MAP[dm][dayunGan] || '未知';
            const ageStart = startAge + i * 10;
            const yearStart = birthYear + ageStart;

            // ========== 吉凶判断 & 颜色 ==========
            // 吉凶判断逻辑 V2.0 专业版：
            // 1. 基础属性：财官印食为善，杀伤劫刃为恶
            // 2. 凶神有制反吉，善神受损反凶
            // 3. 最终叠加格局喜忌修正
            
            // 第一步：基础十神属性判断
            const goodGods = ['正财','偏财','正官','正印','偏印','食神','比肩'];
            const badGods = ['七杀','伤官','劫财','羊刃'];
            
            let isJi = false, isXiong = false;
            let reason = '';
            
            if (goodGods.includes(shishen)) {
                isJi = true;
                reason = '善神临宫';
            } else if (badGods.includes(shishen)) {
                isXiong = true;
                reason = '凶神主事';
            }
            
            // 第二步：特殊规则修正（凶神有制反吉）
            if (shishen === '七杀') {
                // 七杀有食神/印星制反为贵（这里简化，实际看命局组合）
                if (pillars.some(p => SHISHEN_MAP[dm][p.g] === '食神')) {
                    isJi = true;
                    isXiong = false;
                    reason = '杀有食制';
                }
            }
            if (shishen === '伤官') {
                // 伤官配印为吉格
                if (pillars.some(p => SHISHEN_MAP[dm][p.g] === '正印' || SHISHEN_MAP[dm][p.g] === '偏印')) {
                    isJi = true;
                    isXiong = false;
                    reason = '伤官配印';
                }
            }
            
            // 第三步：喜忌最终修正（去掉emoji匹配纯文本）
            const joyText = xiji.joy.join('');
            const tabooText = xiji.taboo.join('');
            
            if (joyText.includes(shishen)) {
                isJi = true;
                isXiong = false;
                reason = '喜用神到位';
            } else if (tabooText.includes(shishen)) {
                isXiong = true;
                isJi = false;
                reason = '忌神逢运';
            }

            let cardClass = '';
            let cardStyle = '';
            let badge = '';
            if (isJi) {
                cardClass = 'dayun-card-ji';
                badge = `<div style="font-size:0.7rem;color:#2e7d32;font-weight:bold;margin-top:5px;">★ ${reason}</div>`;
            } else if (isXiong) {
                cardClass = 'dayun-card-xiong';
                badge = `<div style="font-size:0.7rem;color:#c62828;font-weight:bold;margin-top:5px;">☆ ${reason}</div>`;
            }

            // 背面运势解读文案
            const backTexts = {
                '正财': '财运亨通，利求财创业，收入增长',
                '偏财': '意外之财，利投资投机，贵人相助',
                '正官': '官运亨通，利事业晋升，名声鹊起',
                '七杀': '压力与机遇并存，冲劲足但防是非',
                '正印': '贵人扶持，利学业考试，思维清晰',
                '偏印': '灵感迸发，利创意研究，防小人',

                '劫财': '竞争激烈，防破财，宜守不宜攻'
            };
            const backText = backTexts[shishen] || '运势平稳，稳步前行';

            dayunHtml += `
                <div class="dayun-card ${cardClass}" 
                     onclick="window.flipDayunCard(this)">
                    <div class="dayun-card-inner">
                        <div class="dayun-card-front">
                            <div class="dayun-age">${ageStart} - ${ageStart + 9} 岁</div>
                            <div class="dayun-ganzhi">${dayunGanzhi}</div>
                            <div class="dayun-shishen">${shishen}</div>
                            <div class="dayun-nianfen">${yearStart} - ${yearStart + 9}</div>
                            ${badge}
                            <div class="dayun-hint">点击查看详情 ↻</div>
                        </div>
                        <div class="dayun-card-back">
                            <div style="font-weight:bold;font-size:0.9rem;margin-bottom:5px;">${shishen}运</div>
                            <div>${backText}</div>
                            <div class="flip-hint">点击翻回 ↻</div>
                        </div>
                    </div>
                </div>
            `;
        }

            dayunGrid.innerHTML = dayunHtml;
            dayunArea.style.display = 'block';

            // 渲染神煞
            renderShensha(pillars);
        }

        /**

         */
        window.flipDayunCard = function(card) {
            card.classList.toggle('flipped');
            
            // 兜底：如果CSS3D不生效，用简单的显示切换
            const back = card.querySelector('.dayun-card-back');
            const front = card.querySelector('.dayun-card-front');
            if (back && getComputedStyle(back).display === 'none') {
                if (card.classList.contains('flipped')) {
                    back.style.display = 'flex';
                    front.style.display = 'none';
                } else {
                    back.style.display = '';
                    front.style.display = '';
                }
            }
        }

        window.renderWuxingBar = function(pillars) {
            // 简单计算天干地支（不含藏干比例，仅主气）
            const counts = {'金':0,'木':0,'水':0,'火':0,'土':0};
            pillars.forEach(p => {
            counts[WUXING_MAP[p.g]] += 1; 
            counts[WUXING_MAP[p.z]] += 1; 
            // 藏干简单加权
            const hiddens = HIDDEN_STEMS[p.z] || [];
            hiddens.forEach(h => counts[WUXING_MAP[h]] += 0.5);
        });
        
        let total = 0;
        for(let w in counts) total += counts[w];

        let barHtml = "";
        for(let w in counts) {
            if(counts[w] > 0) {
                const pct = (counts[w] / total) * 100;
                barHtml += `<div class="wx-segment" style="width:${pct}%; background:${WX_COLOR_DATA[w]};"></div>`;
            }
        }
