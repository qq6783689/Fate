<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天命鑑定 · 封面</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');
  body { margin:0; padding:40px; background:#e8d5c0; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .cover {
    width:800px; height:800px;
    background:linear-gradient(180deg, #fef9f0 0%, #fdf5e6 50%, #faf0dc 100%);
    border-radius:4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    font-family:'Noto Serif SC', serif;
    border:4px solid #cfa972;
    box-shadow: 0 8px 40px rgba(139,90,43,0.2);
  }
  .cover::before {
    content:''; position:absolute; top:0;left:0;right:0;bottom:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(207,169,114,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(142,24,24,0.05) 0%, transparent 50%);
    z-index:0;
  }
  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position:absolute; width:60px; height:60px; z-index:2;
  }
  .corner-tl { top:20px; left:20px; border-top:2px solid #cfa972; border-left:2px solid #cfa972; }
  .corner-tr { top:20px; right:20px; border-top:2px solid #cfa972; border-right:2px solid #cfa972; }
  .corner-bl { bottom:20px; left:20px; border-bottom:2px solid #cfa972; border-left:2px solid #cfa972; }
  .corner-br { bottom:20px; right:20px; border-bottom:2px solid #cfa972; border-right:2px solid #cfa972; }
  .cover-inner { position:relative; z-index:1; text-align:center; padding:60px; }
  .cover-badge {
    display:inline-block; padding:6px 20px;
    background:rgba(207,169,114,0.15); border:1px solid rgba(207,169,114,0.4);
    border-radius:20px; color:#8b5a2b; font-size:0.85rem; letter-spacing:3px;
    margin-bottom:30px;
  }
  .cover-title {
    font-family:'Ma Shan Zheng', cursive;
    font-size:4.2rem; color:#8e1818;
    letter-spacing:14px; margin-bottom:4px;
  }
  .cover-subtitle {
    font-size:1.1rem; color:#8b5a2b;
    letter-spacing:8px; margin-bottom:36px;
  }
  .cover-divider {
    width:120px; height:1px; background:linear-gradient(90deg,transparent,#cfa972,transparent);
    margin:0 auto 36px;
  }
  .cover-features {
    display:flex; gap:16px; flex-wrap:wrap; justify-content:center;
    margin-bottom:40px;
  }
  .cover-feat {
    padding:10px 18px;
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(207,169,114,0.3);
    border-radius:6px;
    color:#8b5a2b; font-size:0.9rem; letter-spacing:2px;
    backdrop-filter:blur(4px);
  }
  .cover-desc {
    color:#999; font-size:0.85rem; letter-spacing:3px;
  }
  .seal {
    position:absolute; bottom:60px; right:60px; z-index:2;
    width:70px; height:70px; border:2px solid #c41e3a; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-15deg);
  }
  .seal-text {
    font-family:'Ma Shan Zheng', cursive;
    font-size:0.65rem; color:#c41e3a; line-height:1.3; text-align:center;
  }
  .btn { margin-top:30px; padding:14px 36px; background:linear-gradient(135deg,#8e1818,#c41e3a); color:#fff; border:none; border-radius:8px; font-size:1rem; cursor:pointer; letter-spacing:2px; }
  .btn:hover { background:linear-gradient(135deg,#a51d1d,#d44545); }
</style>
</head>
<body>
<div style="text-align:center;">
  <div class="cover" id="cover">
    <div class="corner-tl"></div><div class="corner-tr"></div>
    <div class="corner-bl"></div><div class="corner-br"></div>
    <div class="seal"><div class="seal-text">天命<br>鑑定</div></div>
    <div class="cover-inner">
      <div class="cover-badge">⚡ 宗师列传 · 极意完整版</div>
      <div class="cover-title">天 命 鑑 定</div>
      <div class="cover-subtitle">了解自己的特质和方向</div>
      <div class="cover-divider"></div>
      <div class="cover-features">
        <div class="cover-feat">🔮 30+ 格局判定</div>
        <div class="cover-feat">📊 七层大运评分</div>
        <div class="cover-feat">👯 双胞胎对比</div>
        <div class="cover-feat">🎯 年龄匹配文案</div>
      </div>
      <div class="cover-desc">一图看懂人生走势</div>
    </div>
  </div>
  <button class="btn" onclick="downloadCover()">📥 下载封面图</button>
</div>
<script src="html2canvas.min.js"></script>
<script>
async function downloadCover() {
  const el = document.getElementById('cover');
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: null });
  const a = document.createElement('a');
  a.download = 'cover.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
